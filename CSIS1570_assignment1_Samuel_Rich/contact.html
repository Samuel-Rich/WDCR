<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Us</title>
</head>
<body>
    <div class="nav">
    <nav>
        <a href="index.html">Peak</a>
        <a href="areas.html">Areas</a>
        <a href="enemies.html">Enemies</a>
        <a href="items.html">Items</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact Us</a>
    </nav>
    </div>
    <form action="http://wwww.foo.com" method="POST">
    <div class="div-two">
    <fieldset>
      <label for="first-name">First name:</label><br>
      <input type="text" id="first-name" name="first-name" required><br>
      <label for="last-name">Last name:</label><br>
      <input type="text" id="last-name" name="last-name" required><br>
    </fieldset>
    <fieldset>
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br>
      <label for="phone">Phone Number:(###) ### - ####</label><br>
      <input type="tel" id="phone" name="phone" pattern="\d{3}-\d{3}-\d{4}"><br>
</fieldset>
<fieldset>
      <legend>Reason for Contact:</legend>
      <input type="checkbox" id="question" name="reason" value="question">
      <label for="question">Question</label><br>
      <input type="checkbox" id="feedback" name="reason" value="feedback">
      <label for="feedback">Feedback</label><br>
      <input type="checkbox" id="complaint" name="reason" value="complaint">
      <label for="complaint">Complaint</label><br>
      <label for="other">Other:</label><br>
      <textarea id="other" name="other" rows="4" cols="30"></textarea><br>
</fieldset>
<fieldset>
    <legend>Has this been helpful?</legend>
    <input type="radio" id="yes" name="helpful" value="yes">
    <label for="yes">Yes</label><br>
    <input type="radio" id="no" name="helpful" value="no">
    <label for="no">No</label><br>
</fieldset>
<fieldset>
    <legend>Would you recommend us to others?</legend>
    <select name="answer" id="recommend">
        <option value="yes">Yes</option>
        <option value="no">No</option>
        <option value="id rather burn in the depths of hell">I'd rather burn in the depths of hell</option>
        <option value="ill think about it">I'll think about it</option>
    </select>
</fieldset>
      <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</div>
    </form>
</body>
</html>
