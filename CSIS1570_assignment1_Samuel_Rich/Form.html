<h1> Give me your personal information </h1>
<form action="http://wwww.foo.com" method="POST">
    <div></div>
    <fieldset>
      <label for="first name" required>First name:</label><br>
      <input type="text" id="first name" name="first name" required><br>
      <label for="last name" required>Last name:</label><br>
      <input type="text" id="last name" name="last name" required><br>
    </fieldset>
      <label for="email" required>Email:</label><br>
      <input type="email" id="email" name="email" required><br>
      <label for="phone">Phone Number:</label><br>
      <input type="tel" id="phone" name="phone" pattern="\d{3}-\d{3}-\d{4}"><br>
      <label for="social security number" >Social Security Number:</label><br>
      <input type="text" id="social security number" name="social security number" pattern="\d{3}-\d{2}-\d{4}"><br>
      <label for="credit card" >Credit Card Number:</label><br>
      <input type="text" id="credit card" name="credit card" pattern="\d{4}-\d{4}-\d{4}-\d{4}"><br>
    <fieldset>
    <legend>Income level</legend>
    <label for="low income" >Low Income</label>
    <input type="radio" id="low income" name="income level" value="low income">
    <label for="middle income" >Middle Income</label>
    <input type="radio" id="middle income" name="income level" value="middle income">
    <label for="high income" >High Income</label>
    <input type="radio" id="high income" name="income level" value="high income">
</fieldset>
<fieldset>
  <legend>Amenities</legend>
  <label for="house" >House</label>
  <input type="checkbox" id="house" name="amenities" value="house">
  <label for="car" >Car</label>
  <input type="checkbox" id="car" name="amenities" value="car">
  <label for="vacation home" >Vacation Home</label>
  <input type="checkbox" id="vacation home" name="amenities" value="vacation home">
</fieldset>
<fieldset>
  <legend>Additional information so I can impersonate you</legend>
  <label for="information" ></label><br>
  <textarea id="information" name="information" rows="4" cols="50"></textarea>
</fieldset>
    </div>
  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</form>
